<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Major System Trainer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
{% load static %}
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="topbar">
  <span class="topbar-title">Major System</span>
  <div class="topbar-nav" role="navigation" aria-label="Main navigation">
    <button class="arrow-pill arrow-pill-center active" data-section="grid" onclick="showSection('grid')">Grid</button>
    <button class="arrow-pill arrow-pill-center" data-section="quiz-nav" onclick="showQuizNav()">Quiz</button>
    <button class="arrow-pill arrow-pill-center" data-section="ref" onclick="showSection('ref')">Reference</button>
    <button class="arrow-pill arrow-pill-center" data-section="translate" onclick="showSection('translate')">Translate</button>
  </div>
  <div class="topbar-right">
    <span id="auth-status"></span>
    <button class="settings-btn" onclick="showSection('settings')" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 000-1.88l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96a7.04 7.04 0 00-1.63-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84a.48.48 0 00-.48.41l-.36 2.54c-.59.24-1.13.57-1.63.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87a.48.48 0 00.12.61l2.03 1.58a7.07 7.07 0 000 1.88l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.57 1.63-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 00-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></svg></button>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" id="theme-toggle"></button>
  </div>
</div>
<div class="container" role="main">
  <div class="subnav" id="subnav" role="navigation" aria-label="Quiz modes">
    <button data-section="quiz" onclick="showSection('quiz')"># &rarr; Word</button>
    <button data-section="reverse" onclick="showSection('reverse')">Word &rarr; #</button>
    <button data-section="mixed" onclick="showSection('mixed')">Mixed</button>
    <button data-section="consonant" onclick="showSection('consonant')">Sound &rarr; #</button>
    <button data-section="gridquiz" onclick="showSection('gridquiz')">Grid Quiz</button>
  </div>

  <!-- GRID ----------------------------------------------------------- -->
  <div id="section-grid" class="section active">
    <div id="grid" class="grid"></div>
  </div>

  <!-- QUIZ: number -> word ------------------------------------------- -->
  <div id="section-quiz" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="quiz-prompt">--</div>
      <input class="quiz-input" id="quiz-input" placeholder="type the noun..."
             autocomplete="off" spellcheck="false" aria-label="Type the word for this number">
      <div>
        <button class="quiz-btn" id="quiz-submit" onclick="checkQuiz()" aria-label="Submit answer">Submit</button>
        <button class="quiz-btn skip" onclick="skipQuiz()" aria-label="Skip question">Skip</button>
      </div>
      <div class="feedback empty" id="quiz-feedback" aria-live="polite"></div>
    </div>
  </div>

  <!-- REVERSE QUIZ: word -> number ----------------------------------- -->
  <div id="section-reverse" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="rev-prompt">--</div>
      <input class="quiz-input" id="rev-input" placeholder="type the number..."
             autocomplete="off" spellcheck="false" maxlength="2" aria-label="Type the number for this word">
      <div>
        <button class="quiz-btn" id="rev-submit" onclick="checkReverse()" aria-label="Submit answer">Submit</button>
        <button class="quiz-btn skip" onclick="skipReverse()" aria-label="Skip question">Skip</button>
      </div>
      <div class="feedback empty" id="rev-feedback" aria-live="polite"></div>
    </div>
  </div>

  <!-- MIXED QUIZ: random direction ----------------------------------- -->
  <div id="section-mixed" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="mix-prompt">--</div>
      <input class="quiz-input" id="mix-input" placeholder="type your answer..."
             autocomplete="off" spellcheck="false" aria-label="Type your answer">
      <div>
        <button class="quiz-btn" id="mix-submit" onclick="checkMixed()" aria-label="Submit answer">Submit</button>
        <button class="quiz-btn skip" onclick="skipMixed()" aria-label="Skip question">Skip</button>
      </div>
      <div class="feedback empty" id="mix-feedback" aria-live="polite"></div>
    </div>
  </div>

  <!-- CONSONANT QUIZ: sound -> digit --------------------------------- -->
  <div id="section-consonant" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="con-prompt">--</div>
      <input class="quiz-input" id="con-input" placeholder="type the digit..."
             autocomplete="off" spellcheck="false" maxlength="1" aria-label="Type the digit for this sound">
      <div>
        <button class="quiz-btn" id="con-submit" onclick="checkCon()" aria-label="Submit answer">Submit</button>
        <button class="quiz-btn skip" onclick="skipCon()" aria-label="Skip question">Skip</button>
      </div>
      <div class="feedback empty" id="con-feedback" aria-live="polite"></div>
    </div>
  </div>

  <!-- GRID QUIZ ------------------------------------------------------ -->
  <div id="section-gridquiz" class="section">
    <div class="gridquiz-controls">
      <button class="quiz-btn" id="gridquiz-check" onclick="checkGridQuiz()">Check All</button>
      <button class="quiz-btn skip" id="gridquiz-reset" onclick="startGridQuiz()">Reset</button>
      <span id="gridquiz-timer" class="gridquiz-timer" role="status"></span>
    </div>
    <div id="gridquiz-grid" class="grid"></div>
    <div id="gridquiz-result" class="gridquiz-result" role="status"></div>
  </div>

  <!-- REFERENCE ------------------------------------------------------ -->
  <div id="section-ref" class="section">
    <div class="ref-wrap">
      <table class="ref-table" id="ref-table">
        <thead><tr><th>Digit</th><th>Consonant Sounds</th></tr></thead>
        <tbody id="ref-body"></tbody>
      </table>
    </div>
  </div>

  <!-- TRANSLATE ------------------------------------------------------ -->
  <div id="section-translate" class="section">
    <div class="translate-area">
      <input class="quiz-input" id="translate-input" placeholder="type numbers..."
             autocomplete="off" spellcheck="false" style="width:100%;max-width:400px;font-size:1.2em" aria-label="Type numbers to translate">
      <div id="translate-output" class="translate-output"></div>
    </div>
  </div>

  <!-- PROFILE -------------------------------------------------------- -->
  <div id="section-profile" class="section">
    <div class="profile-area" id="profile-content"></div>
  </div>

  <!-- SETTINGS ------------------------------------------------------- -->
  <div id="section-settings" class="section">
    <div class="settings-area">
      <h2>Settings</h2>
      <label class="setting-row">
        <span>Timed quiz</span>
        <input type="checkbox" id="setting-timed" onchange="toggleTimedQuiz(this.checked)">
      </label>
      <p class="setting-hint">Add a countdown timer to quiz questions. Higher mastery = less time.</p>
    </div>
  </div>

  <!-- SCORE ---------------------------------------------------------- -->
  <div class="score-bar" id="score-bar">
    Score: <strong id="score-text" aria-live="polite">0 / 0 (0%)</strong>
  </div>
</div>

<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
