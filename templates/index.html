<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Major System Trainer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
{% include "css/theme.css" %}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-page);color:var(--text-primary);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:20px}
/* topbar-nav buttons inherit from .arrow-pill-center via HTML classes */
.subnav{display:none;gap:8px;justify-content:center;margin:12px 0 18px;flex-wrap:wrap}
.subnav.visible{display:flex}
.subnav button{padding:7px 18px;border:1px solid var(--border-color);background:var(--bg-page);color:var(--text-secondary);
  cursor:pointer;border-radius:6px;font-size:.88em;font-weight:600;transition:all .15s}
.subnav button:hover{background:var(--bg-nav-hover);color:var(--text-primary)}
.subnav button.active{background:var(--bg-nav-hover);color:var(--color-primary);border-color:var(--color-primary)}
.section{display:none}
.section.active{display:block}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid-cell{text-align:center;padding:10px 2px;background:var(--bg-surface);border-radius:6px;
  border:1px solid var(--border-color);transition:transform .1s,box-shadow .1s;cursor:default}
.grid-cell:hover{transform:translateY(-2px);box-shadow:0 4px 12px var(--shadow-hover)}
.grid-cell .number{font-weight:700;color:var(--color-primary);font-size:1.1em}
.grid-cell .word{font-size:.82em;color:var(--text-muted);margin-top:2px}

/* Quiz shared */
.quiz-area{max-width:480px;margin:0 auto;text-align:center;padding:20px}
.quiz-prompt{font-size:3.2em;font-weight:700;color:var(--color-primary);margin:30px 0 20px;
  letter-spacing:2px;user-select:none}
.quiz-input{font-size:1.4em;padding:10px 16px;width:220px;text-align:center;
  border:2px solid var(--border-input);border-radius:8px;outline:none;transition:border .15s;
  background:var(--bg-surface);color:var(--text-primary)}
.quiz-input:focus{border-color:var(--color-primary)}
.quiz-btn{padding:10px 28px;font-size:1.1em;background:var(--color-primary);color:var(--color-on-primary);
  border:none;border-radius:8px;cursor:pointer;margin:12px 6px;font-weight:600;transition:background .15s}
.quiz-btn:hover{background:var(--color-primary-hover)}
.quiz-btn.skip{background:var(--color-skip)}
.quiz-btn.skip:hover{background:var(--color-skip-hover)}
.feedback{font-size:1.15em;margin:18px 0;padding:14px 20px;border-radius:8px;font-weight:600;min-height:52px}
.feedback.correct{background:var(--bg-success);color:var(--color-success)}
.feedback.incorrect{background:var(--bg-error);color:var(--color-error)}
.feedback.empty{background:transparent}

/* Score bar */
.score-bar{background:var(--bg-surface);padding:14px 20px;border-radius:8px;text-align:center;
  margin-top:20px;border:1px solid var(--border-color);font-size:1em;color:var(--text-muted)}
.score-bar strong{color:var(--color-primary)}

/* Reference table */
.ref-wrap{max-width:520px;margin:0 auto}
.ref-table{width:100%;border-collapse:collapse;margin-top:10px}
.ref-table th,.ref-table td{padding:10px 14px;border:1px solid var(--border-color);text-align:center}
.ref-table th{background:var(--color-primary);color:var(--color-on-primary);font-weight:600}
.ref-table tr:nth-child(even){background:var(--bg-stripe)}

/* Translate */
.translate-area{max-width:600px;margin:0 auto;text-align:center;padding:20px}
.translate-output{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.translate-chip{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:8px;
  padding:12px 16px;text-align:center;min-width:70px}
.translate-chip .number{font-weight:700;color:var(--color-primary);font-size:1.1em}
.translate-chip .word{font-size:.88em;color:var(--text-muted);margin-top:4px}
.translate-chip.odd{color:var(--text-secondary);font-style:italic;font-size:.9em;
  display:flex;align-items:center;padding:8px 12px;min-width:auto}

/* Arrow pill shared */
.arrow-pill{display:inline-flex;align-items:center;padding:6px 20px;font-weight:600;
  font-size:.88em;border:none;cursor:pointer;transition:all .15s;position:relative;
  background:var(--bg-page);color:var(--text-secondary)}
.arrow-pill:hover{background:var(--bg-nav-hover);color:var(--text-primary)}
.arrow-pill-right{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);
  padding-right:24px}
.arrow-pill-left{clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);
  padding-left:24px}
.arrow-pill-center{clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);
  padding:6px 24px}

/* Top bar */
.topbar{display:flex;align-items:center;gap:4px;padding:8px 20px;
  background:var(--bg-surface);border-bottom:1px solid var(--border-color);flex-wrap:wrap}
.topbar-title{font-size:1.1em;font-weight:700;color:var(--text-primary);
  background:var(--bg-page);padding:6px 24px 6px 14px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.topbar-nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.topbar-nav button{font-family:inherit}
.topbar-nav button.active{background:var(--bg-nav-hover);color:var(--color-primary)}
.topbar-right{display:flex;align-items:center;gap:4px;margin-left:auto}
.theme-toggle{width:34px;height:34px;border:none;
  background:var(--bg-page);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;
  clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);padding-left:12px}
.theme-toggle:hover{background:var(--bg-nav-hover)}
.theme-toggle svg{width:18px;height:18px;fill:var(--text-primary)}

/* Auth pill */
#auth-status{font-size:1em}
#auth-status span{font-weight:700;color:var(--text-primary);margin-right:6px}
.auth-link{color:var(--text-secondary);text-decoration:none;background:var(--bg-page);
  border:none;cursor:pointer;font-size:.88em;font-weight:600;font-family:inherit;
  padding:6px 24px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
.auth-link:hover{background:var(--bg-nav-hover);color:var(--text-primary)}

/* Mastery grid colors */
.mastery-0 { background-color: var(--bg-mastery-0) !important; color: var(--color-mastery-0); }
.mastery-1 { background-color: var(--bg-mastery-1) !important; color: var(--color-mastery-1); }
.mastery-2 { }
.mastery-3 { background-color: var(--bg-mastery-3) !important; color: var(--color-mastery-3); }
.mastery-4 { background-color: var(--bg-mastery-4) !important; color: var(--color-mastery-4); }

/* Responsive */
@media(max-width:700px){
  .grid{grid-template-columns:repeat(5,1fr)}
  .quiz-prompt{font-size:2.4em}
  .topbar{padding:6px 10px;gap:2px}
  .topbar-title{font-size:.95em;padding:5px 18px 5px 10px}
  .arrow-pill{padding:5px 16px;font-size:.8em}
  .arrow-pill-center{padding:5px 18px}
}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-title">Major System</span>
  <div class="topbar-nav">
    <button class="arrow-pill arrow-pill-center active" data-section="grid" onclick="showSection('grid')">Grid</button>
    <button class="arrow-pill arrow-pill-center" data-section="quiz-nav" onclick="showQuizNav()">Quiz</button>
    <button class="arrow-pill arrow-pill-center" data-section="ref" onclick="showSection('ref')">Reference</button>
    <button class="arrow-pill arrow-pill-center" data-section="translate" onclick="showSection('translate')">Translate</button>
  </div>
  <div class="topbar-right">
    <span id="auth-status"></span>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" id="theme-toggle"></button>
  </div>
</div>
<div class="container">
  <div class="subnav" id="subnav">
    <button data-section="quiz" onclick="showSection('quiz')"># &rarr; Word</button>
    <button data-section="reverse" onclick="showSection('reverse')">Word &rarr; #</button>
    <button data-section="mixed" onclick="showSection('mixed')">Mixed</button>
    <button data-section="consonant" onclick="showSection('consonant')">Sound &rarr; #</button>
  </div>

  <!-- GRID ----------------------------------------------------------- -->
  <div id="section-grid" class="section active">
    <div id="grid" class="grid"></div>
  </div>

  <!-- QUIZ: number -> word ------------------------------------------- -->
  <div id="section-quiz" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="quiz-prompt">--</div>
      <input class="quiz-input" id="quiz-input" placeholder="type the noun..."
             autocomplete="off" spellcheck="false">
      <div>
        <button class="quiz-btn" id="quiz-submit" onclick="checkQuiz()">Submit</button>
        <button class="quiz-btn skip" onclick="skipQuiz()">Skip</button>
      </div>
      <div class="feedback empty" id="quiz-feedback"></div>
    </div>
  </div>

  <!-- REVERSE QUIZ: word -> number ----------------------------------- -->
  <div id="section-reverse" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="rev-prompt">--</div>
      <input class="quiz-input" id="rev-input" placeholder="type the number..."
             autocomplete="off" spellcheck="false" maxlength="2">
      <div>
        <button class="quiz-btn" id="rev-submit" onclick="checkReverse()">Submit</button>
        <button class="quiz-btn skip" onclick="skipReverse()">Skip</button>
      </div>
      <div class="feedback empty" id="rev-feedback"></div>
    </div>
  </div>

  <!-- MIXED QUIZ: random direction ----------------------------------- -->
  <div id="section-mixed" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="mix-prompt">--</div>
      <input class="quiz-input" id="mix-input" placeholder="type your answer..."
             autocomplete="off" spellcheck="false">
      <div>
        <button class="quiz-btn" id="mix-submit" onclick="checkMixed()">Submit</button>
        <button class="quiz-btn skip" onclick="skipMixed()">Skip</button>
      </div>
      <div class="feedback empty" id="mix-feedback"></div>
    </div>
  </div>

  <!-- CONSONANT QUIZ: sound -> digit --------------------------------- -->
  <div id="section-consonant" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="con-prompt">--</div>
      <input class="quiz-input" id="con-input" placeholder="type the digit..."
             autocomplete="off" spellcheck="false" maxlength="1">
      <div>
        <button class="quiz-btn" id="con-submit" onclick="checkCon()">Submit</button>
        <button class="quiz-btn skip" onclick="skipCon()">Skip</button>
      </div>
      <div class="feedback empty" id="con-feedback"></div>
    </div>
  </div>

  <!-- REFERENCE ------------------------------------------------------ -->
  <div id="section-ref" class="section">
    <div class="ref-wrap">
      <table class="ref-table" id="ref-table">
        <thead><tr><th>Digit</th><th>Consonant Sounds</th></tr></thead>
        <tbody id="ref-body"></tbody>
      </table>
    </div>
  </div>

  <!-- TRANSLATE ------------------------------------------------------ -->
  <div id="section-translate" class="section">
    <div class="translate-area">
      <input class="quiz-input" id="translate-input" placeholder="type numbers..."
             autocomplete="off" spellcheck="false" style="width:100%;max-width:400px;font-size:1.2em">
      <div id="translate-output" class="translate-output"></div>
    </div>
  </div>

  <!-- SCORE ---------------------------------------------------------- -->
  <div class="score-bar" id="score-bar">
    Score: <strong id="score-text">0 / 0 (0%)</strong>
  </div>
</div>

<script>
/* ================================================================== */
/*  CSRF helper                                                        */
/* ================================================================== */
function getCookie(name){
  var c = document.cookie || '';
  var v = c.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
  return v ? v.pop() : '';
}

/* ================================================================== */
/*  Theme toggle                                                       */
/* ================================================================== */
var sunSVG = '<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-3a1 1 0 01-1-1V1a1 1 0 112 0v2a1 1 0 01-1 1zm0 18a1 1 0 01-1-1v-2a1 1 0 112 0v2a1 1 0 01-1 1zm9-9a1 1 0 01-1 1h-2a1 1 0 110-2h2a1 1 0 011 1zM5 12a1 1 0 01-1 1H2a1 1 0 110-2h2a1 1 0 011 1zm13.07-5.66a1 1 0 01-.71-.29l-1.41-1.42a1 1 0 111.41-1.41l1.42 1.41a1 1 0 01-.71 1.71zM7.05 19.07a1 1 0 01-.71-.29l-1.41-1.42a1 1 0 111.41-1.41l1.42 1.41a1 1 0 01-.71 1.71zM19.07 19.07a1 1 0 01-.71-.29 1 1 0 010-1.42l1.42-1.41a1 1 0 111.41 1.41l-1.41 1.42a1 1 0 01-.71.29zM7.05 7.05a1 1 0 01-.71-.29 1 1 0 010-1.42l1.42-1.41a1 1 0 011.41 1.41L7.76 6.76a1 1 0 01-.71.29z"/></svg>';
var moonSVG = '<svg viewBox="0 0 24 24"><path d="M12.3 4.9a7.45 7.45 0 006.8 6.8 7.5 7.5 0 01-9.5 5.8A7.5 7.5 0 0112.3 4.9M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>';

function toggleTheme(){
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateToggleIcon();
  saveState();
}

function updateToggleIcon(){
  var btn = document.getElementById('theme-toggle');
  var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  btn.innerHTML = isDark ? sunSVG : moonSVG;
}

updateToggleIcon();

/* ================================================================== */
/*  State                                                              */
/* ================================================================== */
var wordlist = {};
var mapping  = {};
var keys     = [];          // ["00","01",...,"99"]
var score    = {correct:0, total:0};
var currentQuiz    = null;  // {digits, word}
var currentReverse = null;  // {digits, word}
var currentMixed   = null;  // {digits, word, mode: 'forward'|'reverse'}
var quizTimer      = null;
var reverseTimer   = null;
var mixedTimer     = null;

// Score-based quiz state (independent per quiz type)
var quizScores = {};         // key → score (default 0)
var quizHistory = [];        // last 10 shown keys (FIFO)

var reverseScores = {};
var reverseHistory = [];

var mixedScores = {};
var mixedHistory = [];

var conScores = {};
var conHistory = [];
var currentCon = null;
var conTimer = null;
var conKeys = [];            // ["S","Z","T","D","TH",...]
var conMap = {};             // {"S":"0","Z":"0","T":"1",...}

/* ================================================================== */
/*  Persistence                                                        */
/* ================================================================== */
function saveState(){
  var state = {
    score: score,
    quizScores: quizScores, quizHistory: quizHistory,
    reverseScores: reverseScores, reverseHistory: reverseHistory,
    mixedScores: mixedScores, mixedHistory: mixedHistory,
    conScores: conScores, conHistory: conHistory
  };
  localStorage.setItem('quizState', JSON.stringify(state));
  // Background sync to server (fire-and-forget)
  fetch('/api/state', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'X-CSRFToken': getCookie('csrftoken')},
    body: JSON.stringify(state)
  }).catch(function(){});
  updateMasteryColors();
}

function loadState(){
  try {
    var s = JSON.parse(localStorage.getItem('quizState'));
    if(!s) return;
    // Detect old format and discard
    if(s.quizPool || s.quizMastered){
      localStorage.removeItem('quizState');
      return;
    }
    score = s.score || {correct:0, total:0};
    quizScores = s.quizScores || {};
    quizHistory = s.quizHistory || [];
    reverseScores = s.reverseScores || {};
    reverseHistory = s.reverseHistory || [];
    mixedScores = s.mixedScores || {};
    mixedHistory = s.mixedHistory || [];
    conScores = s.conScores || {};
    conHistory = s.conHistory || [];
  } catch(e){}
}

function applyState(s){
  score = s.score || {correct:0, total:0};
  quizScores = s.quizScores || {};
  quizHistory = s.quizHistory || [];
  reverseScores = s.reverseScores || {};
  reverseHistory = s.reverseHistory || [];
  mixedScores = s.mixedScores || {};
  mixedHistory = s.mixedHistory || [];
  conScores = s.conScores || {};
  conHistory = s.conHistory || [];
  saveState();
  updateScore();
  renderGrid();
}

function updateAuthUI(username){
  var el = document.getElementById('auth-status');
  if(!el) return;
  if(username){
    el.innerHTML = '<span class="arrow-pill arrow-pill-left" style="font-weight:700;color:var(--text-primary);font-size:1em">' + username + '</span> <form method="post" action="/logout/" style="display:inline"><input type="hidden" name="csrfmiddlewaretoken" value="' + getCookie('csrftoken') + '"><button type="submit" class="auth-link">logout</button></form>';
  } else {
    el.innerHTML = '<a href="/login/" class="auth-link">login</a>';
  }
}

/* ================================================================== */
/*  Init                                                               */
/* ================================================================== */
function buildConMap(){
  conKeys = []; conMap = {};
  for(var digit in mapping){
    mapping[digit].split(', ').forEach(function(c){
      conKeys.push(c);
      conMap[c] = digit;
    });
  }
}

async function init(){
  // Load cached wordlist/mapping from localStorage if available
  var cachedWl = localStorage.getItem('wordlist');
  var cachedMap = localStorage.getItem('mapping');
  if(cachedWl && cachedMap){
    wordlist = JSON.parse(cachedWl);
    mapping = JSON.parse(cachedMap);
    keys = Object.keys(wordlist).sort();
  }

  // Load quiz state from localStorage immediately (offline-first)
  loadState();

  // Build conMap from whatever mapping we have
  buildConMap();
  renderGrid();
  renderRef();
  updateScore();
  updateMasteryColors();

  // Fetch from server in background — update if server has newer data
  try {
    var results = await Promise.all([
      fetch('/api/wordlist'), fetch('/api/mapping'), fetch('/api/state')
    ]);
    var wlRes = results[0], mapRes = results[1], stateRes = results[2];
    if(wlRes.ok){
      wordlist = await wlRes.json();
      localStorage.setItem('wordlist', JSON.stringify(wordlist));
      keys = Object.keys(wordlist).sort();
    }
    if(mapRes.ok){
      mapping = await mapRes.json();
      localStorage.setItem('mapping', JSON.stringify(mapping));
      buildConMap();
    }
    if(stateRes.ok){
      var serverState = await stateRes.json();
      if(serverState.user || (serverState.score && serverState.score.total > score.total)){
        applyState(serverState);
      }
      updateAuthUI(serverState.user);
    }
    renderGrid();
    renderRef();
    updateMasteryColors();
  } catch(e){
    // Offline — use localStorage data, already loaded above
  }
}

/* ================================================================== */
/*  Grid                                                               */
/* ================================================================== */
function renderGrid(){
  var g = document.getElementById('grid');
  g.innerHTML = '';
  for(var i=0;i<100;i++){
    var d = String(i).padStart(2,'0');
    var w = wordlist[d] || '???';
    var c = document.createElement('div');
    c.className = 'grid-cell';
    c.setAttribute('data-key', d);
    c.innerHTML = '<div class="number">'+d+'</div><div class="word">'+w+'</div>';
    g.appendChild(c);
  }
}

/* ================================================================== */
/*  Reference table                                                    */
/* ================================================================== */
function renderRef(){
  var b = document.getElementById('ref-body');
  b.innerHTML = '';
  for(var d=0;d<=9;d++){
    var tr = document.createElement('tr');
    tr.innerHTML = '<td><strong>'+d+'</strong></td><td>'+mapping[String(d)]+'</td>';
    b.appendChild(tr);
  }
}

/* ================================================================== */
/*  Section switching                                                  */
/* ================================================================== */
var quizSections = ['quiz','reverse','mixed','consonant'];

function showSection(name){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('section-'+name).classList.add('active');
  // Update main nav
  document.querySelectorAll('.topbar-nav button').forEach(b=>b.classList.remove('active'));
  var isQuiz = quizSections.indexOf(name) !== -1;
  if(isQuiz){
    document.querySelector('.topbar-nav [data-section="quiz-nav"]').classList.add('active');
    document.getElementById('subnav').classList.add('visible');
  } else {
    document.querySelector('.topbar-nav [data-section="'+name+'"]').classList.add('active');
    document.getElementById('subnav').classList.remove('visible');
  }
  // Update subnav
  document.querySelectorAll('.subnav button').forEach(b=>b.classList.remove('active'));
  var sub = document.querySelector('.subnav [data-section="'+name+'"]');
  if(sub) sub.classList.add('active');
  if(name==='quiz')    startQuiz();
  if(name==='reverse') startReverse();
  if(name==='mixed')   startMixed();
  if(name==='consonant') startCon();
}

function showQuizNav(){
  // Show subnav and activate first quiz mode
  var sub = document.getElementById('subnav');
  if(sub.classList.contains('visible')){
    // Already showing quiz subnav — find active sub-mode or default
    var active = sub.querySelector('button.active');
    if(active) showSection(active.getAttribute('data-section'));
    else showSection('quiz');
  } else {
    showSection('quiz');
  }
}

/* ================================================================== */
/*  Pick next word (score-based with cooldown)                         */
/* ================================================================== */
function pickNext(scores, history, allKeys){
  // Exclude keys in history (last 10 shown)
  var eligible = allKeys.filter(function(k){ return history.indexOf(k) === -1; });
  if(eligible.length === 0) eligible = allKeys.slice(); // fallback if all in cooldown
  // Find minimum score among eligible
  var minScore = Infinity;
  for(var i = 0; i < eligible.length; i++){
    var s = scores[eligible[i]] || 0;
    if(s < minScore) minScore = s;
  }
  // Collect all keys with that minimum score
  var candidates = eligible.filter(function(k){ return (scores[k] || 0) === minScore; });
  // Pick one randomly
  return candidates[Math.floor(Math.random() * candidates.length)];
}

/* ================================================================== */
/*  Quiz: number -> word                                               */
/* ================================================================== */
function startQuiz(){
  clearTimeout(quizTimer);
  var d = pickNext(quizScores, quizHistory, keys);
  if(!d) return;
  currentQuiz = {digits:d, word:wordlist[d]};
  document.getElementById('quiz-prompt').textContent = d;
  var inp = document.getElementById('quiz-input');
  inp.value = '';
  inp.disabled = false;
  document.getElementById('quiz-submit').disabled = false;
  document.getElementById('quiz-feedback').className = 'feedback empty';
  document.getElementById('quiz-feedback').textContent = '';
  inp.focus();
}

function checkQuiz(){
  if(!currentQuiz) return;
  var inp = document.getElementById('quiz-input');
  var answer = inp.value.trim().toLowerCase();
  if(!answer) return;
  inp.disabled = true;
  document.getElementById('quiz-submit').disabled = true;

  var correct = currentQuiz.word.toLowerCase();
  var key = currentQuiz.digits;
  score.total++;
  var fb = document.getElementById('quiz-feedback');
  if(answer === correct){
    score.correct++;
    quizScores[key] = (quizScores[key] || 0) + 1;
    fb.className = 'feedback correct';
    fb.textContent = 'Correct!';
  } else {
    quizScores[key] = (quizScores[key] || 0) - 1;
    fb.className = 'feedback incorrect';
    fb.textContent = 'Incorrect. Answer: "'+correct+'"';
  }
  quizHistory.push(key);
  if(quizHistory.length > 10) quizHistory.shift();
  updateScore();
  saveState();
  quizTimer = setTimeout(startQuiz, 1800);
}

function skipQuiz(){
  if(currentQuiz){
    quizHistory.push(currentQuiz.digits);
    if(quizHistory.length > 10) quizHistory.shift();
    saveState();
  }
  startQuiz();
}

/* ================================================================== */
/*  Reverse quiz: word -> number                                       */
/* ================================================================== */
function startReverse(){
  clearTimeout(reverseTimer);
  var d = pickNext(reverseScores, reverseHistory, keys);
  if(!d) return;
  currentReverse = {digits:d, word:wordlist[d]};
  document.getElementById('rev-prompt').textContent = wordlist[d];
  var inp = document.getElementById('rev-input');
  inp.value = '';
  inp.disabled = false;
  document.getElementById('rev-submit').disabled = false;
  document.getElementById('rev-feedback').className = 'feedback empty';
  document.getElementById('rev-feedback').textContent = '';
  inp.focus();
}

function checkReverse(){
  if(!currentReverse) return;
  var inp = document.getElementById('rev-input');

  if(!raw) return;
  inp.disabled = true;
  document.getElementById('rev-submit').disabled = true;

  // Accept "7" or "07" for "07"
  var answer = raw.padStart(2,'0');
  var correct = currentReverse.digits;

  var fb = document.getElementById('rev-feedback');

  } else {
    reverseScores[correct] = (reverseScores[correct] || 0) - 1;

    fb.textContent = 'Incorrect. Answer: '+correct;
  }
  reverseHistory.push(correct);
  if(reverseHistory.length > 10) reverseHistory.shift();
  updateScore();
  saveState();
  reverseTimer = setTimeout(startReverse, 1800);
}

function skipReverse(){
  if(currentReverse){
    reverseHistory.push(currentReverse.digits);
    if(reverseHistory.length > 10) reverseHistory.shift();
    saveState();
  }
  startReverse();
}

/* ================================================================== */
/*  Mixed quiz: random direction                                       */
/* ================================================================== */
function startMixed(){
  clearTimeout(mixedTimer);
  var d = pickNext(mixedScores, mixedHistory, keys);
  if(!d) return;
  var mode = Math.random() < 0.5 ? 'forward' : 'reverse';
  currentMixed = {digits:d, word:wordlist[d], mode:mode};
  var inp = document.getElementById('mix-input');
  if(mode === 'forward'){
    document.getElementById('mix-prompt').textContent = d;
    inp.placeholder = 'type the noun...';
    inp.maxLength = '';
  } else {
    document.getElementById('mix-prompt').textContent = wordlist[d];
    inp.placeholder = 'type the number...';
    inp.maxLength = '2';
  }
  inp.value = '';
  inp.disabled = false;
  document.getElementById('mix-submit').disabled = false;
  document.getElementById('mix-feedback').className = 'feedback empty';
  document.getElementById('mix-feedback').textContent = '';
  inp.focus();
}

function checkMixed(){
  if(!currentMixed) return;
  var inp = document.getElementById('mix-input');
  var raw = inp.value.trim();
  if(!raw) return;
  inp.disabled = true;
  document.getElementById('mix-submit').disabled = true;

  var isCorrect;
  var correctDisplay;
  var key = currentMixed.digits;
  if(currentMixed.mode === 'forward'){
    isCorrect = raw.toLowerCase() === currentMixed.word.toLowerCase();
    correctDisplay = '"'+currentMixed.word.toLowerCase()+'"';
  } else {
    isCorrect = raw.padStart(2,'0') === key;
    correctDisplay = key;
  }

  score.total++;
  var fb = document.getElementById('mix-feedback');
  if(isCorrect){
    score.correct++;
    mixedScores[key] = (mixedScores[key] || 0) + 1;
    fb.className = 'feedback correct';
    fb.textContent = 'Correct!';
  } else {
    mixedScores[key] = (mixedScores[key] || 0) - 1;
    fb.className = 'feedback incorrect';
    fb.textContent = 'Incorrect. Answer: '+correctDisplay;
  }
  mixedHistory.push(key);
  if(mixedHistory.length > 10) mixedHistory.shift();
  updateScore();
  saveState();
  mixedTimer = setTimeout(startMixed, 1800);
}

function skipMixed(){
  if(currentMixed){
    mixedHistory.push(currentMixed.digits);
    if(mixedHistory.length > 10) mixedHistory.shift();
    saveState();
  }
  startMixed();
}

/* ================================================================== */
/*  Consonant quiz: sound -> digit                                     */

function checkCon(){

  document.getElementById('con-submit').disabled = true;

/* ================================================================== */
/*  Score                                                              */
/* ================================================================== */
function updateScore(){
  var pct = score.total>0 ? Math.round(score.correct/score.total*100) : 0;
  document.getElementById('score-text').textContent =
    score.correct+' / '+score.total+' ('+pct+'%)';
}

/* ================================================================== */
/*  Keyboard: Enter = submit                                           */
/* ================================================================== */
document.getElementById('quiz-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkQuiz();
});
document.getElementById('rev-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkReverse();
});
document.getElementById('mix-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkMixed();
});
document.getElementById('con-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkCon();
});

/* ================================================================== */
/*  Translate: number string -> nouns                                  */
/* ================================================================== */
document.getElementById('translate-input').addEventListener('input', function(){
  var raw = this.value.replace(/[^0-9]/g, '');
  var out = document.getElementById('translate-output');
  out.innerHTML = '';
  if(!raw) return;
  // Split into 2-digit pairs; if odd length, last digit stands alone
  for(var i = 0; i < raw.length; i += 2){
    var chunk = raw.substr(i, 2);
    var chip = document.createElement('div');
    if(chunk.length === 2){
      var w = wordlist[chunk] || '???';
      chip.className = 'translate-chip';
      chip.innerHTML = '<div class="number">'+chunk+'</div><div class="word">'+w+'</div>';
    } else {
      chip.className = 'translate-chip odd';
      chip.textContent = chunk + '?';
    }
    out.appendChild(chip);
  }
});

/* ================================================================== */
/*  Mastery colors                                                     */
/* ================================================================== */
function updateMasteryColors(){
  if(!keys.length) return;
  var cells = document.querySelectorAll('.grid-cell');
  cells.forEach(function(cell){
    var key = cell.getAttribute('data-key');
    if(!key) return;
    // Sum scores across all quiz modes for this key
    var total = (quizScores[key] || 0) + (reverseScores[key] || 0) + (mixedScores[key] || 0);
    // Determine mastery level
    var cls;
    if(total <= -3) cls = 'mastery-0';
    else if(total < 0) cls = 'mastery-1';
    else if(total <= 3) cls = 'mastery-2';
    else if(total <= 8) cls = 'mastery-3';
    else cls = 'mastery-4';
    // Remove old mastery classes and add new
    cell.className = cell.className.replace(/mastery-\d/g, '').trim() + ' ' + cls;
  });
}
