<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Major System Trainer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
(function(){
  var t = localStorage.getItem('theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
})();
</script>
<style>
:root {
  --bg-page: #121220;
  --text-primary: #e0e0e8;
  --text-secondary: #9a9ab0;
  --text-muted: #b0b0c0;
  --color-primary: #5a9fff;
  --color-primary-hover: #4a8fee;
  --bg-surface: #1e1e32;
  --border-color: #2e2e45;
  --border-input: #3a3a55;
  --bg-nav-hover: #252540;
  --color-skip: #7a7a90;
  --color-skip-hover: #9a9ab0;
  --bg-success: #1a3a1e;
  --color-success: #66bb6a;
  --bg-error: #3a1a1a;
  --color-error: #ef5350;
  --bg-stripe: #1a1a2e;
  --shadow-hover: rgba(0,0,0,.25);
}
[data-theme="light"] {
  --bg-page: #f0f2f5;
  --text-primary: #1a1a2e;
  --text-secondary: #666;
  --text-muted: #444;
  --color-primary: #3a86ff;
  --color-primary-hover: #265ecf;
  --bg-surface: #fff;
  --border-color: #e0e0e0;
  --border-input: #d0d0d0;
  --bg-nav-hover: #edf2ff;
  --color-skip: #888;
  --color-skip-hover: #666;
  --bg-success: #e8f5e9;
  --color-success: #2e7d32;
  --bg-error: #ffebee;
  --color-error: #c62828;
  --bg-stripe: #f8f9fb;
  --shadow-hover: rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-page);color:var(--text-primary);min-height:100vh}
.container{max-width:1100px;margin:0 auto;padding:20px}
header{text-align:center;padding:20px 0 10px}
header h1{font-size:1.8em;color:var(--text-primary);margin-bottom:4px}
header p{color:var(--text-secondary);font-size:.95em}
nav{display:flex;gap:8px;justify-content:center;margin:18px 0 0;flex-wrap:wrap}
nav button{padding:9px 22px;border:2px solid var(--color-primary);background:var(--bg-surface);color:var(--color-primary);
  cursor:pointer;border-radius:6px;font-size:.95em;font-weight:600;transition:all .15s}
nav button:hover{background:var(--bg-nav-hover)}
nav button.active{background:var(--color-primary);color:#fff}
.subnav{display:none;gap:8px;justify-content:center;margin:8px 0 18px;flex-wrap:wrap}
.subnav.visible{display:flex}
.subnav button{padding:7px 18px;border:2px solid var(--border-color);background:var(--bg-surface);color:var(--text-secondary);
  cursor:pointer;border-radius:6px;font-size:.88em;font-weight:600;transition:all .15s}
.subnav button:hover{background:var(--bg-nav-hover);border-color:var(--color-primary);color:var(--color-primary)}
.subnav button.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.section{display:none}
.section.active{display:block}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid-cell{text-align:center;padding:10px 2px;background:var(--bg-surface);border-radius:6px;
  border:1px solid var(--border-color);transition:transform .1s,box-shadow .1s;cursor:default}
.grid-cell:hover{transform:translateY(-2px);box-shadow:0 4px 12px var(--shadow-hover)}
.grid-cell .number{font-weight:700;color:var(--color-primary);font-size:1.1em}
.grid-cell .word{font-size:.82em;color:var(--text-muted);margin-top:2px}

/* Quiz shared */
.quiz-area{max-width:480px;margin:0 auto;text-align:center;padding:20px}
.quiz-prompt{font-size:3.2em;font-weight:700;color:var(--color-primary);margin:30px 0 20px;
  letter-spacing:2px;user-select:none}
.quiz-input{font-size:1.4em;padding:10px 16px;width:220px;text-align:center;
  border:2px solid var(--border-input);border-radius:8px;outline:none;transition:border .15s;
  background:var(--bg-surface);color:var(--text-primary)}
.quiz-input:focus{border-color:var(--color-primary)}
.quiz-btn{padding:10px 28px;font-size:1.1em;background:var(--color-primary);color:#fff;
  border:none;border-radius:8px;cursor:pointer;margin:12px 6px;font-weight:600;transition:background .15s}
.quiz-btn:hover{background:var(--color-primary-hover)}
.quiz-btn.skip{background:var(--color-skip)}
.quiz-btn.skip:hover{background:var(--color-skip-hover)}
.feedback{font-size:1.15em;margin:18px 0;padding:14px 20px;border-radius:8px;font-weight:600;min-height:52px}
.feedback.correct{background:var(--bg-success);color:var(--color-success)}
.feedback.incorrect{background:var(--bg-error);color:var(--color-error)}
.feedback.empty{background:transparent}

/* Score bar */
.score-bar{background:var(--bg-surface);padding:14px 20px;border-radius:8px;text-align:center;
  margin-top:20px;border:1px solid var(--border-color);font-size:1em;color:var(--text-muted)}
.score-bar strong{color:var(--color-primary)}

/* Reference table */
.ref-wrap{max-width:520px;margin:0 auto}
.ref-table{width:100%;border-collapse:collapse;margin-top:10px}
.ref-table th,.ref-table td{padding:10px 14px;border:1px solid var(--border-color);text-align:center}
.ref-table th{background:var(--color-primary);color:#fff;font-weight:600}
.ref-table tr:nth-child(even){background:var(--bg-stripe)}

/* Theme toggle */
.theme-toggle{position:fixed;top:14px;right:14px;width:40px;height:40px;border-radius:50%;
  border:1px solid var(--border-color);background:var(--bg-surface);cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:1000;transition:background .15s}
.theme-toggle:hover{background:var(--bg-nav-hover)}
.theme-toggle svg{width:20px;height:20px;fill:var(--text-primary)}

/* Responsive */
@media(max-width:700px){
  .grid{grid-template-columns:repeat(5,1fr)}
  .quiz-prompt{font-size:2.4em}
}
</style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" id="theme-toggle"></button>
<div class="container">
  <header>
    <h1>Major System Trainer</h1>
    <p>Memorize 00-99 with concrete noun associations</p>
  </header>

  <nav>
    <button class="active" data-section="grid" onclick="showSection('grid')">Grid</button>
    <button data-section="quiz-nav" onclick="showQuizNav()">Quiz</button>
    <button data-section="ref" onclick="showSection('ref')">Reference</button>
  </nav>
  <div class="subnav" id="subnav">
    <button data-section="quiz" onclick="showSection('quiz')"># &rarr; Word</button>
    <button data-section="reverse" onclick="showSection('reverse')">Word &rarr; #</button>
    <button data-section="mixed" onclick="showSection('mixed')">Mixed</button>
    <button data-section="consonant" onclick="showSection('consonant')">Sound &rarr; #</button>
  </div>

  <!-- GRID ----------------------------------------------------------- -->
  <div id="section-grid" class="section active">
    <div id="grid" class="grid"></div>
  </div>

  <!-- QUIZ: number -> word ------------------------------------------- -->
  <div id="section-quiz" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="quiz-prompt">--</div>
      <input class="quiz-input" id="quiz-input" placeholder="type the noun..."
             autocomplete="off" spellcheck="false">
      <div>
        <button class="quiz-btn" id="quiz-submit" onclick="checkQuiz()">Submit</button>
        <button class="quiz-btn skip" onclick="skipQuiz()">Skip</button>
      </div>
      <div class="feedback empty" id="quiz-feedback"></div>
    </div>
  </div>

  <!-- REVERSE QUIZ: word -> number ----------------------------------- -->
  <div id="section-reverse" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="rev-prompt">--</div>
      <input class="quiz-input" id="rev-input" placeholder="type the number..."
             autocomplete="off" spellcheck="false" maxlength="2">
      <div>
        <button class="quiz-btn" id="rev-submit" onclick="checkReverse()">Submit</button>
        <button class="quiz-btn skip" onclick="skipReverse()">Skip</button>
      </div>
      <div class="feedback empty" id="rev-feedback"></div>
    </div>
  </div>

  <!-- MIXED QUIZ: random direction ----------------------------------- -->
  <div id="section-mixed" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="mix-prompt">--</div>
      <input class="quiz-input" id="mix-input" placeholder="type your answer..."
             autocomplete="off" spellcheck="false">
      <div>
        <button class="quiz-btn" id="mix-submit" onclick="checkMixed()">Submit</button>
        <button class="quiz-btn skip" onclick="skipMixed()">Skip</button>
      </div>
      <div class="feedback empty" id="mix-feedback"></div>
    </div>
  </div>

  <!-- CONSONANT QUIZ: sound -> digit --------------------------------- -->
  <div id="section-consonant" class="section">
    <div class="quiz-area">
      <div class="quiz-prompt" id="con-prompt">--</div>
      <input class="quiz-input" id="con-input" placeholder="type the digit..."
             autocomplete="off" spellcheck="false" maxlength="1">
      <div>
        <button class="quiz-btn" id="con-submit" onclick="checkCon()">Submit</button>
        <button class="quiz-btn skip" onclick="skipCon()">Skip</button>
      </div>
      <div class="feedback empty" id="con-feedback"></div>
    </div>
  </div>

  <!-- REFERENCE ------------------------------------------------------ -->
  <div id="section-ref" class="section">
    <div class="ref-wrap">
      <table class="ref-table" id="ref-table">
        <thead><tr><th>Digit</th><th>Consonant Sounds</th></tr></thead>
        <tbody id="ref-body"></tbody>
      </table>
    </div>
  </div>

  <!-- SCORE ---------------------------------------------------------- -->
  <div class="score-bar" id="score-bar">
    Score: <strong id="score-text">0 / 0 (0%)</strong>
  </div>
</div>

<script>
/* ================================================================== */
/*  Theme toggle                                                       */
/* ================================================================== */
var sunSVG = '<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zm0-3a1 1 0 01-1-1V1a1 1 0 112 0v2a1 1 0 01-1 1zm0 18a1 1 0 01-1-1v-2a1 1 0 112 0v2a1 1 0 01-1 1zm9-9a1 1 0 01-1 1h-2a1 1 0 110-2h2a1 1 0 011 1zM5 12a1 1 0 01-1 1H2a1 1 0 110-2h2a1 1 0 011 1zm13.07-5.66a1 1 0 01-.71-.29l-1.41-1.42a1 1 0 111.41-1.41l1.42 1.41a1 1 0 01-.71 1.71zM7.05 19.07a1 1 0 01-.71-.29l-1.41-1.42a1 1 0 111.41-1.41l1.42 1.41a1 1 0 01-.71 1.71zM19.07 19.07a1 1 0 01-.71-.29 1 1 0 010-1.42l1.42-1.41a1 1 0 111.41 1.41l-1.41 1.42a1 1 0 01-.71.29zM7.05 7.05a1 1 0 01-.71-.29 1 1 0 010-1.42l1.42-1.41a1 1 0 011.41 1.41L7.76 6.76a1 1 0 01-.71.29z"/></svg>';
var moonSVG = '<svg viewBox="0 0 24 24"><path d="M12.3 4.9a7.45 7.45 0 006.8 6.8 7.5 7.5 0 01-9.5 5.8A7.5 7.5 0 0112.3 4.9M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>';

function toggleTheme(){
  var current = document.documentElement.getAttribute('data-theme');
  var next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateToggleIcon();
}

function updateToggleIcon(){
  var btn = document.getElementById('theme-toggle');
  var isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  btn.innerHTML = isDark ? sunSVG : moonSVG;
}

updateToggleIcon();

/* ================================================================== */
/*  State                                                              */
/* ================================================================== */
let wordlist = {};
let mapping  = {};
let keys     = [];          // ["00","01",...,"99"]
let score    = {correct:0, total:0};
let currentQuiz    = null;  // {digits, word}
let currentReverse = null;  // {digits, word}
let currentMixed   = null;  // {digits, word, mode: 'forward'|'reverse'}
let quizTimer      = null;
let reverseTimer   = null;
let mixedTimer     = null;

// Pool-based quiz state (independent per quiz type)
let quizPool = [];           // 10 active keys for forward quiz
let quizStreaks = {};        // key → consecutive correct count
let quizMastered = {};       // key → true when graduated

let reversePool = [];        // same for reverse quiz
let reverseStreaks = {};
let reverseMastered = {};

let mixedPool = [];          // same for mixed quiz
let mixedStreaks = {};
let mixedMastered = {};

let conPool = [];            // consonant quiz
let conStreaks = {};
let conMastered = {};
let currentCon = null;
let conTimer = null;
let conKeys = [];            // ["S","Z","T","D","TH",...]
let conMap = {};             // {"S":"0","Z":"0","T":"1",...}

/* ================================================================== */
/*  Persistence                                                        */
/* ================================================================== */
function saveState(){
  localStorage.setItem('quizState', JSON.stringify({
    score: score,
    quizPool: quizPool, quizStreaks: quizStreaks, quizMastered: quizMastered,
    reversePool: reversePool, reverseStreaks: reverseStreaks, reverseMastered: reverseMastered,
    mixedPool: mixedPool, mixedStreaks: mixedStreaks, mixedMastered: mixedMastered,
    conPool: conPool, conStreaks: conStreaks, conMastered: conMastered
  }));
}

function loadState(){
  try {
    var s = JSON.parse(localStorage.getItem('quizState'));
    if(!s) return;
    score = s.score || {correct:0, total:0};
    quizPool = s.quizPool || [];
    quizStreaks = s.quizStreaks || {};
    quizMastered = s.quizMastered || {};
    reversePool = s.reversePool || [];
    reverseStreaks = s.reverseStreaks || {};
    reverseMastered = s.reverseMastered || {};
    mixedPool = s.mixedPool || [];
    mixedStreaks = s.mixedStreaks || {};
    mixedMastered = s.mixedMastered || {};
    conPool = s.conPool || [];
    conStreaks = s.conStreaks || {};
    conMastered = s.conMastered || {};
  } catch(e){}
}

/* ================================================================== */
/*  Init                                                               */
/* ================================================================== */
async function init(){
  const [wlRes, mapRes] = await Promise.all([
    fetch('/api/wordlist'), fetch('/api/mapping')
  ]);
  wordlist = await wlRes.json();
  mapping  = await mapRes.json();
  keys     = Object.keys(wordlist).sort();
  // Build consonant→digit lookup
  conKeys = []; conMap = {};
  for(var digit in mapping){
    mapping[digit].split(', ').forEach(function(c){
      conKeys.push(c);
      conMap[c] = digit;
    });
  }
  loadState();
  renderGrid();
  renderRef();
  updateScore();
}

/* ================================================================== */
/*  Grid                                                               */
/* ================================================================== */
function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for(let i=0;i<100;i++){
    const d = String(i).padStart(2,'0');
    const w = wordlist[d] || '???';
    const c = document.createElement('div');
    c.className = 'grid-cell';
    c.innerHTML = '<div class="number">'+d+'</div><div class="word">'+w+'</div>';
    g.appendChild(c);
  }
}

/* ================================================================== */
/*  Reference table                                                    */
/* ================================================================== */
function renderRef(){
  const b = document.getElementById('ref-body');
  b.innerHTML = '';
  for(let d=0;d<=9;d++){
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><strong>'+d+'</strong></td><td>'+mapping[String(d)]+'</td>';
    b.appendChild(tr);
  }
}

/* ================================================================== */
/*  Section switching                                                  */
/* ================================================================== */
var quizSections = ['quiz','reverse','mixed','consonant'];

function showSection(name){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('section-'+name).classList.add('active');
  // Update main nav
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  var isQuiz = quizSections.indexOf(name) !== -1;
  if(isQuiz){
    document.querySelector('[data-section="quiz-nav"]').classList.add('active');
    document.getElementById('subnav').classList.add('visible');
  } else {
    document.querySelector('[data-section="'+name+'"]').classList.add('active');
    document.getElementById('subnav').classList.remove('visible');
  }
  // Update subnav
  document.querySelectorAll('.subnav button').forEach(b=>b.classList.remove('active'));
  var sub = document.querySelector('.subnav [data-section="'+name+'"]');
  if(sub) sub.classList.add('active');
  if(name==='quiz')    startQuiz();
  if(name==='reverse') startReverse();
  if(name==='mixed')   startMixed();
  if(name==='consonant') startCon();
}

function showQuizNav(){
  // Show subnav and activate first quiz mode
  var sub = document.getElementById('subnav');
  if(sub.classList.contains('visible')){
    // Already showing quiz subnav — find active sub-mode or default
    var active = sub.querySelector('button.active');
    if(active) showSection(active.getAttribute('data-section'));
    else showSection('quiz');
  } else {
    showSection('quiz');
  }
}

/* ================================================================== */
/*  Pool helpers                                                       */
/* ================================================================== */
function initPool(mastered){
  var available = keys.filter(function(k){ return !mastered[k]; });
  // Fisher-Yates shuffle
  for(var i = available.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = available[i]; available[i] = available[j]; available[j] = tmp;
  }
  return available.slice(0, 10);
}

function replaceInPool(pool, masteredKey, mastered){
  var idx = pool.indexOf(masteredKey);
  if(idx !== -1) pool.splice(idx, 1);
  var available = keys.filter(function(k){ return !mastered[k] && pool.indexOf(k) === -1; });
  if(available.length > 0){
    pool.push(available[Math.floor(Math.random() * available.length)]);
  }
}

function pickFromPool(pool, lastKey){
  if(pool.length === 0) return null;
  if(pool.length === 1) return pool[0];
  var pick;
  do { pick = pool[Math.floor(Math.random() * pool.length)]; } while(pick === lastKey);
  return pick;
}

/* ================================================================== */
/*  Quiz: number -> word                                               */
/* ================================================================== */
function startQuiz(){
  clearTimeout(quizTimer);
  if(quizPool.length === 0){
    if(Object.keys(quizMastered).length >= keys.length){
      quizMastered = {}; quizStreaks = {};
    }
    quizPool = initPool(quizMastered);
    saveState();
  }
  var lastKey = currentQuiz ? currentQuiz.digits : null;
  const d = pickFromPool(quizPool, lastKey);
  if(!d) return;
  currentQuiz = {digits:d, word:wordlist[d]};
  document.getElementById('quiz-prompt').textContent = d;
  const inp = document.getElementById('quiz-input');
  inp.value = '';
  inp.disabled = false;
  document.getElementById('quiz-submit').disabled = false;
  document.getElementById('quiz-feedback').className = 'feedback empty';
  document.getElementById('quiz-feedback').textContent = '';
  inp.focus();
}

function checkQuiz(){
  if(!currentQuiz) return;
  const inp = document.getElementById('quiz-input');
  const answer = inp.value.trim().toLowerCase();
  if(!answer) return;
  inp.disabled = true;
  document.getElementById('quiz-submit').disabled = true;

  const correct = currentQuiz.word.toLowerCase();
  const key = currentQuiz.digits;
  score.total++;
  const fb = document.getElementById('quiz-feedback');
  if(answer === correct){
    score.correct++;
    fb.className = 'feedback correct';
    quizStreaks[key] = (quizStreaks[key] || 0) + 1;
    if(quizStreaks[key] >= 3){
      quizMastered[key] = true;
      replaceInPool(quizPool, key, quizMastered);
      var masteredKeys = Object.keys(quizMastered);
      if(masteredKeys.length >= 80){
        var recycled = masteredKeys[Math.floor(Math.random() * masteredKeys.length)];
        delete quizMastered[recycled];
        quizStreaks[recycled] = 0;
        fb.textContent = 'Correct! Mastered \u2014 recycled "'+recycled+'" back.';
      } else {
        fb.textContent = 'Correct! Mastered ('+masteredKeys.length+'/80) \u2014 new word incoming.';
      }
    } else {
      fb.textContent = 'Correct! (streak: '+quizStreaks[key]+'/3)';
    }
  } else {
    fb.className = 'feedback incorrect';
    fb.textContent = 'Incorrect. Answer: "'+correct+'"';
    quizStreaks[key] = 0;
  }
  updateScore();
  saveState();
  quizTimer = setTimeout(startQuiz, 1800);
}

function skipQuiz(){
  if(currentQuiz) quizStreaks[currentQuiz.digits] = 0;
  saveState();
  startQuiz();
}

/* ================================================================== */
/*  Reverse quiz: word -> number                                       */
/* ================================================================== */
function startReverse(){
  clearTimeout(reverseTimer);
  if(reversePool.length === 0){
    if(Object.keys(reverseMastered).length >= keys.length){
      reverseMastered = {}; reverseStreaks = {};
    }
    reversePool = initPool(reverseMastered);
    saveState();
  }
  var lastKey = currentReverse ? currentReverse.digits : null;
  const d = pickFromPool(reversePool, lastKey);
  if(!d) return;
  currentReverse = {digits:d, word:wordlist[d]};
  document.getElementById('rev-prompt').textContent = wordlist[d];
  const inp = document.getElementById('rev-input');
  inp.value = '';
  inp.disabled = false;
  document.getElementById('rev-submit').disabled = false;
  document.getElementById('rev-feedback').className = 'feedback empty';
  document.getElementById('rev-feedback').textContent = '';
  inp.focus();
}

function checkReverse(){
  if(!currentReverse) return;
  const inp = document.getElementById('rev-input');
  const raw = inp.value.trim();
  if(!raw) return;
  inp.disabled = true;
  document.getElementById('rev-submit').disabled = true;

  // Accept "7" or "07" for "07"
  const answer = raw.padStart(2,'0');
  const correct = currentReverse.digits;
  score.total++;
  const fb = document.getElementById('rev-feedback');
  if(answer === correct){
    score.correct++;
    fb.className = 'feedback correct';
    reverseStreaks[correct] = (reverseStreaks[correct] || 0) + 1;
    if(reverseStreaks[correct] >= 3){
      reverseMastered[correct] = true;
      replaceInPool(reversePool, correct, reverseMastered);
      var masteredKeys = Object.keys(reverseMastered);
      if(masteredKeys.length >= 80){
        var recycled = masteredKeys[Math.floor(Math.random() * masteredKeys.length)];
        delete reverseMastered[recycled];
        reverseStreaks[recycled] = 0;
        fb.textContent = 'Correct! Mastered \u2014 recycled "'+recycled+'" back.';
      } else {
        fb.textContent = 'Correct! Mastered ('+masteredKeys.length+'/80) \u2014 new word incoming.';
      }
    } else {
      fb.textContent = 'Correct! (streak: '+reverseStreaks[correct]+'/3)';
    }
  } else {
    fb.className = 'feedback incorrect';
    fb.textContent = 'Incorrect. Answer: '+correct;
    reverseStreaks[correct] = 0;
  }
  updateScore();
  saveState();
  reverseTimer = setTimeout(startReverse, 1800);
}

function skipReverse(){
  if(currentReverse) reverseStreaks[currentReverse.digits] = 0;
  saveState();
  startReverse();
}

/* ================================================================== */
/*  Mixed quiz: random direction                                       */
/* ================================================================== */
function startMixed(){
  clearTimeout(mixedTimer);
  if(mixedPool.length === 0){
    if(Object.keys(mixedMastered).length >= keys.length){
      mixedMastered = {}; mixedStreaks = {};
    }
    mixedPool = initPool(mixedMastered);
    saveState();
  }
  var lastKey = currentMixed ? currentMixed.digits : null;
  const d = pickFromPool(mixedPool, lastKey);
  if(!d) return;
  var mode = Math.random() < 0.5 ? 'forward' : 'reverse';
  currentMixed = {digits:d, word:wordlist[d], mode:mode};
  const inp = document.getElementById('mix-input');
  if(mode === 'forward'){
    document.getElementById('mix-prompt').textContent = d;
    inp.placeholder = 'type the noun...';
    inp.maxLength = '';
  } else {
    document.getElementById('mix-prompt').textContent = wordlist[d];
    inp.placeholder = 'type the number...';
    inp.maxLength = '2';
  }
  inp.value = '';
  inp.disabled = false;
  document.getElementById('mix-submit').disabled = false;
  document.getElementById('mix-feedback').className = 'feedback empty';
  document.getElementById('mix-feedback').textContent = '';
  inp.focus();
}

function checkMixed(){
  if(!currentMixed) return;
  const inp = document.getElementById('mix-input');
  const raw = inp.value.trim();
  if(!raw) return;
  inp.disabled = true;
  document.getElementById('mix-submit').disabled = true;

  var isCorrect;
  var correctDisplay;
  var key = currentMixed.digits;
  if(currentMixed.mode === 'forward'){
    isCorrect = raw.toLowerCase() === currentMixed.word.toLowerCase();
    correctDisplay = '"'+currentMixed.word.toLowerCase()+'"';
  } else {
    isCorrect = raw.padStart(2,'0') === key;
    correctDisplay = key;
  }

  score.total++;
  const fb = document.getElementById('mix-feedback');
  if(isCorrect){
    score.correct++;
    fb.className = 'feedback correct';
    mixedStreaks[key] = (mixedStreaks[key] || 0) + 1;
    if(mixedStreaks[key] >= 3){
      mixedMastered[key] = true;
      replaceInPool(mixedPool, key, mixedMastered);
      var masteredKeys = Object.keys(mixedMastered);
      if(masteredKeys.length >= 80){
        var recycled = masteredKeys[Math.floor(Math.random() * masteredKeys.length)];
        delete mixedMastered[recycled];
        mixedStreaks[recycled] = 0;
        fb.textContent = 'Correct! Mastered \u2014 recycled "'+recycled+'" back.';
      } else {
        fb.textContent = 'Correct! Mastered ('+masteredKeys.length+'/80) \u2014 new word incoming.';
      }
    } else {
      fb.textContent = 'Correct! (streak: '+mixedStreaks[key]+'/3)';
    }
  } else {
    fb.className = 'feedback incorrect';
    fb.textContent = 'Incorrect. Answer: '+correctDisplay;
    mixedStreaks[key] = 0;
  }
  updateScore();
  saveState();
  mixedTimer = setTimeout(startMixed, 1800);
}

function skipMixed(){
  if(currentMixed) mixedStreaks[currentMixed.digits] = 0;
  saveState();
  startMixed();
}

/* ================================================================== */
/*  Consonant quiz: sound -> digit                                     */
/* ================================================================== */
function initConPool(mastered){
  var available = conKeys.filter(function(k){ return !mastered[k]; });
  for(var i = available.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = available[i]; available[i] = available[j]; available[j] = tmp;
  }
  return available.slice(0, 10);
}

function replaceInConPool(pool, masteredKey, mastered){
  var idx = pool.indexOf(masteredKey);
  if(idx !== -1) pool.splice(idx, 1);
  var available = conKeys.filter(function(k){ return !mastered[k] && pool.indexOf(k) === -1; });
  if(available.length > 0){
    pool.push(available[Math.floor(Math.random() * available.length)]);
  }
}

function startCon(){
  clearTimeout(conTimer);
  var masteryThreshold = conKeys.length - 4;
  if(conPool.length === 0){
    if(Object.keys(conMastered).length >= conKeys.length){
      conMastered = {}; conStreaks = {};
    }
    conPool = initConPool(conMastered);
    saveState();
  }
  var lastKey = currentCon;
  var pick = pickFromPool(conPool, lastKey);
  if(!pick) return;
  currentCon = pick;
  document.getElementById('con-prompt').textContent = pick;
  var inp = document.getElementById('con-input');
  inp.value = '';
  inp.disabled = false;
  document.getElementById('con-submit').disabled = false;
  document.getElementById('con-feedback').className = 'feedback empty';
  document.getElementById('con-feedback').textContent = '';
  inp.focus();
}

function checkCon(){
  if(!currentCon) return;
  var inp = document.getElementById('con-input');
  var answer = inp.value.trim();
  if(!answer) return;
  inp.disabled = true;
  document.getElementById('con-submit').disabled = true;

  var correct = conMap[currentCon];
  var key = currentCon;
  var masteryThreshold = conKeys.length - 4;
  score.total++;
  var fb = document.getElementById('con-feedback');
  if(answer === correct){
    score.correct++;
    fb.className = 'feedback correct';
    conStreaks[key] = (conStreaks[key] || 0) + 1;
    if(conStreaks[key] >= 3){
      conMastered[key] = true;
      replaceInConPool(conPool, key, conMastered);
      var masteredKeys = Object.keys(conMastered);
      if(masteredKeys.length >= masteryThreshold){
        var recycled = masteredKeys[Math.floor(Math.random() * masteredKeys.length)];
        delete conMastered[recycled];
        conStreaks[recycled] = 0;
        fb.textContent = 'Correct! Mastered \u2014 recycled "'+recycled+'" back.';
      } else {
        fb.textContent = 'Correct! Mastered ('+masteredKeys.length+'/'+masteryThreshold+') \u2014 new sound incoming.';
      }
    } else {
      fb.textContent = 'Correct! (streak: '+conStreaks[key]+'/3)';
    }
  } else {
    fb.className = 'feedback incorrect';
    fb.textContent = 'Incorrect. Answer: '+correct;
    conStreaks[key] = 0;
  }
  updateScore();
  saveState();
  conTimer = setTimeout(startCon, 1800);
}

function skipCon(){
  if(currentCon) conStreaks[currentCon] = 0;
  saveState();
  startCon();
}

/* ================================================================== */
/*  Score                                                              */
/* ================================================================== */
function updateScore(){
  const pct = score.total>0 ? Math.round(score.correct/score.total*100) : 0;
  document.getElementById('score-text').textContent =
    score.correct+' / '+score.total+' ('+pct+'%)';
}

/* ================================================================== */
/*  Keyboard: Enter = submit                                           */
/* ================================================================== */
document.getElementById('quiz-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkQuiz();
});
document.getElementById('rev-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkReverse();
});
document.getElementById('mix-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkMixed();
});
document.getElementById('con-input').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkCon();
});

/* ================================================================== */
/*  Boot                                                               */
/* ================================================================== */
init();
</script>
